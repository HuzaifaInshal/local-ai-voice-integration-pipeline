<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alfa AI Studio</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="mode-initial">
    <div class="app-viewport">
        
        <!-- Screen 1: Initial Centered Display + Text Input -->
        <div id="screenInitial" class="screen-initial">
            <div class="center-content">
                <div id="transcriptDisplay" class="transcript-display">Ask Alfa a Question</div>
                
                <div class="text-input-bar">
                    <input type="text" id="queryInput" placeholder="Type your query (e.g. top 5 customers by sales)..." autocomplete="off">
                    <button id="querySubmitBtn" title="Send Query">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                    </button>
                </div>

                <div class="visualizer-wrapper">
                    <canvas id="capsuleVisualizer" width="240" height="70"></canvas>
                </div>
            </div>
        </div>

        <!-- Screen 2: Full-Screen Multi-Query Results View -->
        <div id="screenResults" class="screen-results hidden">
            <!-- Full-Screen Scrollable Conversation Feed -->
            <div id="conversationFeed" class="conversation-feed">
                <!-- Dynamically populated with user query cards + AI response streams -->
            </div>

            <!-- Compact Bottom Bar in Screen 2 with Text Input -->
            <div class="bottom-control-bar">
                <div class="bottom-input-bar">
                    <input type="text" id="queryInputBottom" placeholder="Ask another question..." autocomplete="off">
                    <button id="querySubmitBtnBottom" title="Send Query">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                    </button>
                </div>
                <div class="bottom-visualizer-wrapper">
                    <canvas id="capsuleVisualizerBottom" width="140" height="40"></canvas>
                </div>
            </div>
        </div>

    </div>

    <script src="js/visualizer.js"></script>
    <script src="js/wakeword.js"></script>
    <script src="js/chart_renderer.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
