<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ReAct Agent POC</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --accent: #5b8cff;
    --text: #e6e8ec;
    --muted: #8a8f9c;
    --user: #2b3a55;
    --bot: #1e2128;
    --tool: #202a20;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header button {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  header button:hover { color: var(--text); border-color: var(--accent); }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 820px;
    margin: 0 auto;
    width: 100%;
  }
  .msg { padding: 10px 14px; border-radius: 10px; max-width: 75%; line-height: 1.45; font-size: 14px; white-space: pre-wrap; }
  .user { align-self: flex-end; background: var(--user); }
  .bot { align-self: flex-start; background: var(--bot); border: 1px solid var(--border); }

  .trace {
    align-self: flex-start;
    max-width: 85%;
    background: var(--tool);
    border: 1px solid #2f4a2f;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    color: #b7d9b7;
    font-family: ui-monospace, Menlo, monospace;
  }
  .trace summary { cursor: pointer; color: #9fcf9f; }
  .trace pre { margin: 6px 0 0 0; white-space: pre-wrap; word-break: break-word; }

  #inputBar {
    border-top: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    gap: 10px;
    max-width: 820px;
    margin: 0 auto;
    width: 100%;
  }
  #inputBar input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14px;
  }
  #inputBar input:focus { outline: none; border-color: var(--accent); }
  #inputBar button {
    background: var(--accent);
    border: none;
    color: white;
    padding: 0 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  #inputBar button:disabled { opacity: 0.5; cursor: default; }
  .hint { color: var(--muted); font-size: 12px; padding: 0 20px 10px; max-width: 820px; margin: 0 auto; width: 100%; }
</style>
</head>
<body>

<header>
  <h1>ReAct Agent POC — try: "what's the status of order 7?" or "total revenue from delivered orders"</h1>
  <button id="resetBtn">Reset session</button>
</header>

<div id="chat"></div>
<div class="hint" id="hint"></div>
<div id="inputBar">
  <input id="userInput" type="text" placeholder="Ask something that needs the SQL tool..." />
  <button id="sendBtn">Send</button>
</div>

<script>
const sessionId = "kaggle-poc-" + Math.random().toString(36).slice(2);
const chat = document.getElementById("chat");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const resetBtn = document.getElementById("resetBtn");
const hint = document.getElementById("hint");
hint.textContent = "session: " + sessionId;

function addMsg(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function addTrace(trace) {
  if (!trace || trace.length === 0) return;
  trace.forEach(t => {
    const details = document.createElement("details");
    details.className = "trace";
    const summary = document.createElement("summary");
    summary.textContent = "tool call: " + t.tool + "(" + JSON.stringify(t.args) + ")";
    const pre = document.createElement("pre");
    pre.textContent = t.result;
    details.appendChild(summary);
    details.appendChild(pre);
    chat.appendChild(details);
  });
  chat.scrollTop = chat.scrollHeight;
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  addMsg("user", text);
  input.value = "";
  sendBtn.disabled = true;

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message: text })
    });
    const data = await res.json();
    addTrace(data.trace);
    addMsg("bot", data.reply);
  } catch (e) {
    addMsg("bot", "Error: " + e.message);
  } finally {
    sendBtn.disabled = false;
  }
}

sendBtn.addEventListener("click", send);
input.addEventListener("keydown", e => { if (e.key === "Enter") send(); });

resetBtn.addEventListener("click", async () => {
  await fetch("/api/reset", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ session_id: sessionId })
  });
  chat.innerHTML = "";
  addMsg("bot", "Session reset. History cleared.");
});
</script>

</body>
</html>
