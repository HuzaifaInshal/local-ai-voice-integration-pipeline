<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Voice Studio — ReAct Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="mode-hero">

  <header>
    <div class="header-left">
      <button class="icon-btn" id="backBtn" title="Back to Voice View">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
      </button>
      <span class="header-title">AI Voice Studio</span>
    </div>
    <div class="header-right">
      <button class="reset-btn" id="resetBtn">Reset session</button>
      <div class="mic-badge listening" id="headerMicBadge" title="Voice Listener Ready">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
          <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
          <line x1="12" y1="19" x2="12" y2="23" />
          <line x1="8" y1="23" x2="16" y2="23" />
        </svg>
      </div>
    </div>
  </header>

  <main>
    <!-- HERO INITIAL VOICE SCREEN -->
    <div id="heroContainer">
      <div class="hero-text-wrapper">
        <h1 class="hero-text placeholder" id="heroText">Say "Alfa" to start</h1>
      </div>

      <!-- 4 Blue Vertical Waveform Pills -->
      <div class="waveform-container" id="heroWaveform" title="Click to toggle listening">
        <div class="wave-pill"></div>
        <div class="wave-pill"></div>
        <div class="wave-pill"></div>
        <div class="wave-pill"></div>
      </div>

      <!-- Status Tag -->
      <div class="status-pill" id="statusPill">
        <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <polyline points="20 6 9 17 4 12" />
        </svg>
        <span id="statusPillText">Say "Alfa" to start • Auto search is on</span>
      </div>
    </div>

    <!-- CHAT THREAD VIEW -->
    <div id="chatContainer"></div>
  </main>

  <div class="session-hint" id="sessionHint"></div>

  <div id="inputBar">
    <button class="compact-mic-btn" id="bottomMicBtn" title="Toggle Listening">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
        <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
        <line x1="12" y1="19" x2="12" y2="23" />
        <line x1="8" y1="23" x2="16" y2="23" />
      </svg>
    </button>
    <input id="userInput" type="text" placeholder="Ask something or say 'Alfa'..." />
    <button id="sendBtn">Send</button>
  </div>

  <!-- Full-Screen Chart Modal -->
  <div class="chart-modal-backdrop" id="chartModal">
    <div class="chart-modal-content">
      <div class="chart-modal-header">
        <div class="chart-modal-title-wrap">
          <div class="chart-modal-title" id="modalChartTitle">Visualization</div>
          <div class="chart-modal-meta" id="modalChartMeta"></div>
        </div>
        <div class="chart-modal-actions">
          <button class="artifact-action-btn" id="modalPngBtn" type="button">PNG</button>
          <button class="chart-modal-close-btn" id="modalCloseBtn" type="button" title="Close (Esc)">✕</button>
        </div>
      </div>
      <div class="chart-modal-body">
        <canvas class="modal-chart-canvas" id="modalChartCanvas"></canvas>
      </div>
    </div>
  </div>

  <!-- Load Modular Scripts -->
  <script src="/static/charts.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
