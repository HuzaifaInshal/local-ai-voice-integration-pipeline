<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ReAct Agent POC</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --accent: #5b8cff;
    --text: #e6e8ec;
    --muted: #8a8f9c;
    --user: #2b3a55;
    --bot: #1e2128;
    --tool: #202a20;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header button {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  header button:hover { color: var(--text); border-color: var(--accent); }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 820px;
    margin: 0 auto;
    width: 100%;
  }
  .msg { padding: 10px 14px; border-radius: 10px; max-width: 75%; line-height: 1.5; font-size: 14px; white-space: pre-wrap; }
  .user { align-self: flex-end; background: var(--user); }
  .bot { align-self: flex-start; background: var(--bot); border: 1px solid var(--border); }

  /* fade-in per streamed chunk */
  .token {
    display: inline;
    opacity: 0;
    transform: translateY(3px);
    animation: fadeIn 0.28s ease forwards;
  }
  @keyframes fadeIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .typing {
    align-self: flex-start;
    display: flex;
    gap: 4px;
    padding: 12px 14px;
    background: var(--bot);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted);
    animation: pulse 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }

  .trace {
    align-self: flex-start;
    max-width: 85%;
    background: var(--tool);
    border: 1px solid #2f4a2f;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    color: #b7d9b7;
    font-family: ui-monospace, Menlo, monospace;
    opacity: 0;
    animation: fadeIn 0.3s ease forwards;
  }
  .trace summary { cursor: pointer; color: #9fcf9f; }
  .trace pre { margin: 6px 0 0 0; white-space: pre-wrap; word-break: break-word; }

  #inputBar {
    border-top: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    gap: 10px;
    max-width: 820px;
    margin: 0 auto;
    width: 100%;
  }
  #inputBar input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14px;
  }
  #inputBar input:focus { outline: none; border-color: var(--accent); }
  #inputBar button {
    background: var(--accent);
    border: none;
    color: white;
    padding: 0 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  #inputBar button:disabled { opacity: 0.5; cursor: default; }
  .hint { color: var(--muted); font-size: 12px; padding: 0 20px 10px; max-width: 820px; margin: 0 auto; width: 100%; }
</style>
</head>
<body>

<header>
  <h1>ReAct Agent POC — try: "what's the status of order 7?" or "total revenue from delivered orders"</h1>
  <button id="resetBtn">Reset session</button>
</header>

<div id="chat"></div>
<div class="hint" id="hint"></div>
<div id="inputBar">
  <input id="userInput" type="text" placeholder="Ask something that needs the SQL tool..." />
  <button id="sendBtn">Send</button>
</div>

<script>
const sessionId = "kaggle-poc-" + Math.random().toString(36).slice(2);
const chat = document.getElementById("chat");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const resetBtn = document.getElementById("resetBtn");
const hint = document.getElementById("hint");
hint.textContent = "session: " + sessionId;

function addMsg(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function addTypingIndicator() {
  const div = document.createElement("div");
  div.className = "typing";
  div.innerHTML = "<span></span><span></span><span></span>";
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function addTrace(t) {
  const details = document.createElement("details");
  details.className = "trace";
  const summary = document.createElement("summary");
  summary.textContent = "tool call: " + t.tool + "(" + JSON.stringify(t.args) + ")";
  const pre = document.createElement("pre");
  pre.textContent = t.result;
  details.appendChild(summary);
  details.appendChild(pre);
  chat.appendChild(details);
  chat.scrollTop = chat.scrollHeight;
}

// Appends a chunk of text to a bot bubble as a fading-in span, so it
// reads like a live stream rather than one blob dropping in at once.
function appendToken(bubble, text) {
  const span = document.createElement("span");
  span.className = "token";
  span.textContent = text;
  bubble.appendChild(span);
  chat.scrollTop = chat.scrollHeight;
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  addMsg("user", text);
  input.value = "";
  sendBtn.disabled = true;

  const typingEl = addTypingIndicator();
  let botBubble = null;

  try {
    const res = await fetch("/api/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message: text })
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const parts = buffer.split("\n\n");
      buffer = parts.pop(); // keep the possibly-incomplete last chunk

      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith("data:")) continue;
        const payload = line.slice(5).trim();
        if (payload === "[DONE]") continue;

        let event;
        try { event = JSON.parse(payload); } catch { continue; }

        if (event.type === "tool") {
          if (typingEl.parentNode) typingEl.remove();
          addTrace(event);
        } else if (event.type === "token") {
          if (typingEl.parentNode) typingEl.remove();
          if (!botBubble) botBubble = addMsg("bot", "");
          appendToken(botBubble, event.text);
        } else if (event.type === "error") {
          if (typingEl.parentNode) typingEl.remove();
          addMsg("bot", "Error: " + event.message);
        }
      }
    }
  } catch (e) {
    if (typingEl.parentNode) typingEl.remove();
    addMsg("bot", "Error: " + e.message);
  } finally {
    sendBtn.disabled = false;
  }
}

sendBtn.addEventListener("click", send);
input.addEventListener("keydown", e => { if (e.key === "Enter") send(); });

resetBtn.addEventListener("click", async () => {
  await fetch("/api/reset", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ session_id: sessionId })
  });
  chat.innerHTML = "";
  addMsg("bot", "Session reset. History cleared.");
});
</script>

</body>
</html>
